<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720">
  <style>
    text { font-family: "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",Arial,sans-serif; fill:#111; }
    .title { font-size:34px; font-weight:700; }
    .dir { font-size:26px; font-weight:700; }
    .label { font-size:22px; font-weight:700; }
    .sub { font-size:16px; }
    .dim { font-size:18px; }
    .outline { fill:none; stroke:#111; stroke-width:4; }
    .zone { stroke:#555; stroke-width:2; }
  </style>

  <rect width="1800" height="720" fill="#fff"/>
  <text x="55" y="55" class="title">QIMO Global Headquarters｜精准功能色块图 V3.1</text>
  <text x="55" y="88" class="sub">比例基准：东西宽固定 10m；南北为长边。样衣生产车间位于正北侧并向西延伸。</text>

  <!-- Orientation -->
  <text x="900" y="120" text-anchor="middle" class="dir">东（玻璃采光面）</text>
  <text x="900" y="690" text-anchor="middle" class="dir">西（电梯 / 主入口侧）</text>
  <text x="72" y="385" text-anchor="middle" class="dir">北</text>
  <text x="1730" y="385" text-anchor="middle" class="dir">南</text>

  <!-- Main shell: 60m x 10m, exact 6:1 aspect -->
  <rect x="180" y="180" width="1440" height="240" class="outline"/>

  <!-- PDS extension at north side, extending west -->
  <rect x="180" y="420" width="240" height="240" fill="#dce6f2" class="outline"/>
  <text x="300" y="525" text-anchor="middle" class="label">样衣生产车间 PDS</text>
  <text x="300" y="557" text-anchor="middle" class="sub">约100㎡</text>
  <text x="300" y="586" text-anchor="middle" class="sub">正北侧向西延伸</text>
  <text x="392" y="445" text-anchor="end" class="sub">总部内门</text>
  <text x="195" y="640" class="sub">独立外门</text>

  <!-- Zones -->
  <rect x="180" y="180" width="510" height="92" fill="#cfe3f4" class="zone"/>
  <text x="435" y="220" text-anchor="middle" class="label">展厅带</text>
  <text x="435" y="250" text-anchor="middle" class="sub">品牌 / 成衣 / 面料</text>

  <rect x="690" y="180" width="600" height="108" fill="#d8edc8" class="zone"/>
  <text x="990" y="224" text-anchor="middle" class="label">业务部 + 采购部</text>
  <text x="990" y="256" text-anchor="middle" class="sub">正东采光面</text>

  <rect x="690" y="300" width="460" height="120" fill="#ded0ea" class="zone"/>
  <text x="920" y="347" text-anchor="middle" class="label">生产部 / QC / 生产协调</text>
  <text x="920" y="380" text-anchor="middle" class="sub">与业务正对的西侧</text>

  <rect x="1150" y="300" width="150" height="60" fill="#f8e7a8" class="zone"/>
  <text x="1225" y="327" text-anchor="middle" class="sub">业务样衣</text>
  <text x="1225" y="348" text-anchor="middle" class="sub">存放室</text>

  <rect x="1150" y="360" width="150" height="60" fill="#f4dfbd" class="zone"/>
  <text x="1225" y="388" text-anchor="middle" class="sub">茶水间 / 协作区</text>

  <rect x="1300" y="300" width="120" height="120" fill="#d8c7e8" class="zone"/>
  <text x="1360" y="350" text-anchor="middle" class="label">财务室</text>
  <text x="1360" y="380" text-anchor="middle" class="sub">西南</text>

  <rect x="1420" y="180" width="200" height="240" fill="#f2c7c7" class="zone"/>
  <text x="1520" y="292" text-anchor="middle" class="label">老板办公室</text>
  <text x="1520" y="324" text-anchor="middle" class="sub">南侧完整管理区</text>

  <rect x="420" y="330" width="270" height="90" fill="#e7e7e7" class="zone"/>
  <text x="555" y="370" text-anchor="middle" class="label">主入口 / 前厅 / 会议</text>
  <text x="555" y="398" text-anchor="middle" class="sub">西侧电梯进入</text>

  <!-- Dimensions -->
  <line x1="180" y1="145" x2="1620" y2="145" stroke="#111" stroke-width="2"/>
  <line x1="180" y1="137" x2="180" y2="153" stroke="#111" stroke-width="2"/>
  <line x1="1620" y1="137" x2="1620" y2="153" stroke="#111" stroke-width="2"/>
  <text x="900" y="138" text-anchor="middle" class="dim">南北向长边 ≈ 60m（若700㎡含100㎡样衣车间）</text>

  <line x1="150" y1="180" x2="150" y2="420" stroke="#111" stroke-width="2"/>
  <line x1="142" y1="180" x2="158" y2="180" stroke="#111" stroke-width="2"/>
  <line x1="142" y1="420" x2="158" y2="420" stroke="#111" stroke-width="2"/>
  <text x="128" y="300" transform="rotate(-90 128 300)" text-anchor="middle" class="dim">东西宽 10m</text>

  <text x="520" y="475" class="sub">关键说明：</text>
  <text x="520" y="505" class="sub">1. 此图首先纠正建筑比例与方位：主体为南北长、东西窄。</text>
  <text x="520" y="535" class="sub">2. 样衣生产车间不是主体内部房间，而是正北端向西凸出的独立长方形。</text>
  <text x="520" y="565" class="sub">3. 若700㎡不包含样衣车间，则主体长度应调整为约70m，功能区按比例拉长。</text>
</svg>